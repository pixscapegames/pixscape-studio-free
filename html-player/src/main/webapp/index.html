<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pixscape HTML Preview</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    html, body, #embed-html {
      position: fixed;
      inset: 0;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    canvas {
      position: fixed !important;
      left: 0 !important;
      top: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      display: block;
      z-index: 1;
      outline: none;
    }

    .pixscape-preloader-meter {
      position: fixed;
      left: 50%;
      top: 50%;
      width: min(52vw, 420px);
      height: 10px;
      transform: translate(-50%, -50%);
      overflow: hidden;
      background: #141c24;
    }

    .pixscape-preloader-meter-fill {
      display: block;
      width: 0;
      height: 100%;
      background: #40d1f0;
    }
  </style>
</head>

<body>
<div id="embed-html"></div>

<script src="pixscape-preview.js"></script>
<script src="htmlplayer/htmlplayer.nocache.js"></script>
</body>
</html>
