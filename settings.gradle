pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.PREFER_SETTINGS

    repositories {
        mavenCentral()
        maven { url = uri("https://oss.sonatype.org/content/repositories/snapshots/") }
        maven { url = uri("https://jitpack.io") }

        if (providers.gradleProperty("useMavenLocal").map { it.toBoolean() }.orElse(false).get()) {
            mavenLocal()
        }
    }
}

rootProject.name = "pixscape-studio"

include('html-player')
