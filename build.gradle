import java.time.LocalDate
import java.time.format.DateTimeFormatter
import java.security.MessageDigest

plugins {
  id 'application'
  id 'org.beryx.runtime' version "${beryxRuntimePluginVersion}"
  id 'org.graalvm.buildtools.native' version "${graalNativePluginVersion}" apply false
}

apply from: file('gradle/htmlPlayerLibreJs.gradle')

group = 'games.pixscape'
version = appVersion

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(javaVersion as int)
  }
}

allprojects {
  apply plugin: 'idea'

  idea {
    module {
      outputDir = file('build/classes/java/main')
      testOutputDir = file('build/classes/java/test')
    }
  }
}

application {
  mainClass = 'games.pixscape.studio.PixscapeStudioApplication'
}

def releaseDocumentationFiles = files([
        'LICENSE',
        'NOTICE',
        'THIRD_PARTY_NOTICES.txt',
        'README.md',
        'CHANGELOG.md',
        'TRADEMARK.md'
].findAll { file(it).exists() })

distributions {
  main {
    contents {
      from(releaseDocumentationFiles)
    }
  }
}

dependencies {
  implementation "games.pixscape:pixscape-runtime:${pixscapeRuntimeVersion}"

  implementation "com.github.tommyettinger:libgdx-utils:${utilsVersion}"
  implementation "com.badlogicgames.gdx:gdx-freetype:${gdxVersion}"
  implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:${gdxVersion}"
  implementation "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-desktop"
  implementation "com.badlogicgames.gdx-controllers:gdx-controllers-core:${gdxControllersVersion}"

  implementation "com.badlogicgames.gdx:gdx-box2d:${gdxVersion}"
  implementation "com.badlogicgames.gdx:gdx-box2d-platform:${gdxVersion}:natives-desktop"
  implementation "com.github.tommyettinger:libgdx-utils-box2d:${utilsBox2dVersion}"
  implementation "com.badlogicgames.box2dlights:box2dlights:${box2dlightsVersion}"

  implementation "space.earlygrey:shapedrawer:${shapeDrawerVersion}"
  implementation "com.kotcrab.vis:vis-ui:${visUiVersion}"

  implementation "com.github.tommyettinger:libgdx-texturepacker:${texturePackerOnlyVersion}"
  implementation "com.github.tommyettinger:libgdx-textureunpacker:${textureUnpackerOnlyVersion}"

  testImplementation "junit:junit:${junitVersion}"
  testImplementation "com.badlogicgames.gdx:gdx-backend-headless:${gdxVersion}"
}

sourceSets {
  main {
    resources {
      srcDir 'src/main/resources'
    }
  }
}

tasks.named('processResources', Copy).configure {
  // The checked-in HTML preview template is reused during normal Studio runs.
  // Rebuild it explicitly with buildHtmlPreviewTemplate, or pass
  // -PrefreshHtmlPreviewTemplate=true when changing html-player sources.
  if (providers.gradleProperty("refreshHtmlPreviewTemplate").map { it.toBoolean() }.orElse(false).get()) {
    dependsOn 'buildHtmlPreviewTemplate'
  }

  duplicatesStrategy = DuplicatesStrategy.EXCLUDE

  from('assets') {
    into 'assets'
  }
  from('icons') {
    into 'icons'
  }
}

tasks.named('run', JavaExec).configure {
  workingDir = file("${projectDir}/assets")
  jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.named('test', Test).configure {
  useJUnit()
}

tasks.register('distFat', Jar) {
  dependsOn configurations.runtimeClasspath
  archiveClassifier = 'all'
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE

  manifest {
    attributes(
            'Main-Class': application.mainClass.get()
    )
  }

  from {
    configurations.runtimeClasspath.collect { dep ->
      dep.isDirectory() ? dep : zipTree(dep)
    }
  }
  from sourceSets.main.output
}

tasks.named('jar', Jar).configure {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

def currentOs = System.getProperty("os.name").toLowerCase(java.util.Locale.ROOT)
def isWindows = currentOs.contains("win")
def isLinux = currentOs.contains("linux")
def isMac = currentOs.contains("mac")

runtime {
  modules = ['java.se', 'jdk.unsupported', 'jdk.httpserver']
  options = ['--strip-debug', '--no-header-files', '--no-man-pages']

  launcher {
    noConsole = true
    jvmArgs = [
            '--enable-native-access=ALL-UNNAMED',
            '-Xms512m',
            '-Xmx2g'
    ] + (isMac ? ['-XstartOnFirstThread', '-Djava.awt.headless=true'] : [])
  }

  jpackage {
    imageName = appName
    installerName = appName
    appVersion = project.version.toString()

    imageOptions = ['--verbose']
    installerOptions = [
            '--verbose',
            '--vendor', appVendor
    ]

    if (isWindows) {
      installerType = 'app-image'

      def iconFile = file('icons/pixscape_icon.ico')
      if (iconFile.exists()) {
        imageOptions += ['--icon', iconFile.absolutePath]
      }
    } else if (isLinux) {
      installerType = 'deb'

      def iconFile = file('icons/pixscape_icon.png')
      if (iconFile.exists()) {
        imageOptions += ['--icon', iconFile.absolutePath]
        installerOptions += ['--icon', iconFile.absolutePath]
      }

      installerOptions += [
              '--linux-shortcut',
              '--linux-menu-group', 'Development',
              '--linux-deb-maintainer', 'info@pixscape.games'
      ]
    } else if (isMac) {
      installerType = 'dmg'

      def iconFile = file('icons/icon.icns')
      if (iconFile.exists()) {
        imageOptions += ['--icon', iconFile.absolutePath]
        installerOptions += ['--icon', iconFile.absolutePath]
      }

      installerOptions += [
              '--mac-package-identifier', appId,
              '--mac-package-name', appName
      ]
    }
  }
}

tasks.register('packageWindowsZip', Zip) {
  group = 'distribution'
  description = 'Build Windows portable ZIP from jpackage app image'
  dependsOn 'jpackageImage'
  onlyIf { isWindows }

  archiveBaseName = appName
  archiveVersion = project.version.toString()
  archiveClassifier = 'windows'
  destinationDirectory = layout.buildDirectory.dir('distributions')

  from(layout.buildDirectory.dir("jpackage/${appName}")) {
    into appName
  }
}

tasks.register('packageLinuxDeb') {
  group = 'distribution'
  description = 'Build Linux DEB installer with jpackage'
  dependsOn 'jpackage'
  onlyIf { isLinux }
}

tasks.register('packageMacDmg') {
  group = 'distribution'
  description = 'Build macOS DMG installer with jpackage'
  dependsOn 'jpackage'
  onlyIf { isMac }
}

def releaseDisplayName = 'Pixscape Studio Free'
def releaseArchiveName = 'Pixscape-Studio-Free'
def linuxDistributionRootName = "${releaseArchiveName}-${project.version}"
def linuxTarGzFileName = "${releaseArchiveName}-${project.version}-linux-x64.tar.gz"
def appImageFileName = "${releaseArchiveName}-${project.version}-x86_64.AppImage"
def appDirDesktopId = 'pixscape-studio-free'
def appDirInstallPath = 'usr/lib/pixscape-studio-free'
def installedStartScriptName = project.name
def installedDistributionDir = layout.buildDirectory.dir("install/${project.name}")
def appDir = layout.buildDirectory.dir("appimage/${releaseArchiveName}.AppDir")
def linuxTarGzFile = layout.buildDirectory.file("distributions/${linuxTarGzFileName}")
def linuxTarGzSha256File = layout.buildDirectory.file("distributions/${linuxTarGzFileName}.sha256")
def appImageFile = layout.buildDirectory.file("distributions/${appImageFileName}")
def appImageSha256File = layout.buildDirectory.file("distributions/${appImageFileName}.sha256")
def appIconFile = file('icons/pixscape_icon.png')

tasks.register('linuxTarGz', Tar) {
  group = 'distribution'
  description = 'Build reproducible Linux x64 tar.gz distribution'
  dependsOn 'installDist'

  compression = Compression.GZIP
  archiveFileName = linuxTarGzFileName
  destinationDirectory = layout.buildDirectory.dir('distributions')
  preserveFileTimestamps = false
  reproducibleFileOrder = true
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE

  from(installedDistributionDir) {
    into linuxDistributionRootName
    exclude 'bin/*.bat'
  }
}

tasks.register('linuxTarGzSha256') {
  group = 'distribution'
  description = 'Generate SHA256 checksum for linuxTarGz'
  dependsOn 'linuxTarGz'

  inputs.file(linuxTarGzFile)
  outputs.file(linuxTarGzSha256File)

  doLast {
    writeSha256File(linuxTarGzFile.get().asFile, linuxTarGzSha256File.get().asFile)
  }
}

tasks.named('linuxTarGz') {
  finalizedBy 'linuxTarGzSha256'
}

tasks.register('createAppDir', Sync) {
  group = 'distribution'
  description = 'Create AppImage AppDir for Pixscape Studio Free'
  dependsOn 'installDist'

  into appDir

  from(installedDistributionDir) {
    into appDirInstallPath
    exclude 'bin/*.bat'
  }

  if (appIconFile.exists()) {
    from(appIconFile) {
      into '.'
      rename { "${appDirDesktopId}.png" }
    }
    from(appIconFile) {
      into 'usr/share/icons/hicolor/256x256/apps'
      rename { "${appDirDesktopId}.png" }
    }
  }

  doLast {
    def appDirRoot = appDir.get().asFile
    def appRun = new File(appDirRoot, 'AppRun')
    def usrBin = new File(appDirRoot, 'usr/bin')
    def usrBinLauncher = new File(usrBin, appDirDesktopId)
    def desktopFile = new File(appDirRoot, "${appDirDesktopId}.desktop")
    def applicationsDir = new File(appDirRoot, 'usr/share/applications')
    def sharedDesktopFile = new File(applicationsDir, "${appDirDesktopId}.desktop")
    def distributionLauncher = new File(appDirRoot, "${appDirInstallPath}/bin/${installedStartScriptName}")

    usrBin.mkdirs()
    applicationsDir.mkdirs()

    appRun.setText("""\
#!/usr/bin/env sh
set -eu
APPDIR="\$(CDPATH= cd -- "\$(dirname -- "\$0")" && pwd)"
exec "\$APPDIR/${appDirInstallPath}/bin/${installedStartScriptName}" "\$@"
""".stripIndent(), 'UTF-8')

    usrBinLauncher.setText("""\
#!/usr/bin/env sh
set -eu
APPDIR="\${APPDIR:-\$(CDPATH= cd -- "\$(dirname -- "\$0")/../.." && pwd)}"
exec "\$APPDIR/${appDirInstallPath}/bin/${installedStartScriptName}" "\$@"
""".stripIndent(), 'UTF-8')

    def desktopText = """\
[Desktop Entry]
Type=Application
Name=${releaseDisplayName}
Comment=Open-source 2D game studio for LibGDX and Pixscape Runtime
Exec=AppRun %F
Icon=${appDirDesktopId}
Terminal=false
Categories=Development;IDE;Graphics;Game;
""".stripIndent()
    desktopFile.setText(desktopText, 'UTF-8')
    sharedDesktopFile.setText(desktopText, 'UTF-8')

    [appRun, usrBinLauncher, distributionLauncher].findAll { it.exists() }.each {
      it.setExecutable(true, false)
    }
  }
}

tasks.register('appImage', Exec) {
  group = 'distribution'
  description = 'Build x86_64 AppImage using appimagetool'
  dependsOn 'createAppDir'

  inputs.dir(appDir)
  outputs.file(appImageFile)
  environment 'ARCH', 'x86_64'

  doFirst {
    def tool = resolveAppImageTool()
    def output = appImageFile.get().asFile
    output.parentFile.mkdirs()
    if (output.exists() && !output.delete()) {
      throw new GradleException("Could not replace existing AppImage: ${output}")
    }
    commandLine tool, appDir.get().asFile.absolutePath, output.absolutePath
  }
}

tasks.register('appImageSha256') {
  group = 'distribution'
  description = 'Generate SHA256 checksum for appImage'
  dependsOn 'appImage'

  inputs.file(appImageFile)
  outputs.file(appImageSha256File)

  doLast {
    writeSha256File(appImageFile.get().asFile, appImageSha256File.get().asFile)
  }
}

tasks.named('appImage') {
  finalizedBy 'appImageSha256'
}

String resolveAppImageTool() {
  def configured = findProperty('appimagetool')?.toString()?.trim()
  if (configured) {
    return requireAppImageToolPath(configured, 'Gradle property appimagetool')
  }

  def environmentPath = System.getenv('APPIMAGETOOL')?.trim()
  if (environmentPath) {
    return requireAppImageToolPath(environmentPath, 'APPIMAGETOOL')
  }

  def path = System.getenv('PATH') ?: ''
  def names = isWindowsPathLookup() ? ['appimagetool.exe', 'appimagetool'] : ['appimagetool']
  for (def directory : path.split(java.io.File.pathSeparator).findAll { it }) {
    for (def name : names) {
      def candidate = new File(directory, name)
      if (candidate.isFile() && candidate.canExecute()) {
        return candidate.absolutePath
      }
    }
  }

  throw new GradleException("""\
appimagetool was not found.

Install appimagetool from https://github.com/AppImage/AppImageKit/releases, make it executable, then rerun:
  ./gradlew appImage -Pappimagetool=/path/to/appimagetool

You can also set APPIMAGETOOL=/path/to/appimagetool or put an executable named appimagetool on PATH.
""".stripIndent())
}

String requireAppImageToolPath(String path, String source) {
  def tool = file(path)
  if (!tool.isFile()) {
    throw new GradleException("${source} points to '${path}', but that file does not exist.")
  }
  if (!tool.canExecute()) {
    throw new GradleException("${source} points to '${path}', but it is not executable. Run chmod +x on appimagetool and try again.")
  }
  return tool.absolutePath
}

static boolean isWindowsPathLookup() {
  return System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT).contains('win')
}

// Helps if debugging on Linux with an Nvidia GPU.
// This means StartupHelper won't try to restart the JVM, which can prevent debugging.
// This only applies to Gradle tasks, not main methods debugged when launching a main() method directly.
// As a more general solution, set the environment variable __GL_THREADED_OPTIMIZATIONS to 0 globally, on Linux
// machines with Nvidia GPUs where you need to debug LWJGL3 apps and games.
// You can also set __GL_THREADED_OPTIMIZATIONS to 0 in run configurations, which you would need per main() method.
// StartupHelper will still restart the JVM to set this environment variable when run as a distributable JAR, which is
// a good thing for end users. They won't need to ever set the debug-specific environment variable.
tasks.withType(JavaExec.class).configureEach {
  environment("__GL_THREADED_OPTIMIZATIONS", 0)
}

